const D=()=>({rev:'sample',viewer:'someone.far.away',showEdit:true,
profile:{user:'her.little.moments',name:'Her Name',bio:'sunshine in human form ☀️\nmaking ordinary days softer\n📍 far from me, close in my thoughts',avatar:ph('#f6c9d0','#f3e3d3','🌸'),posts:'',followers:'1,284',following:'312'},
posts:[P('#f6c9d0','#fbe9d7','😊','That smile','golden hour and good company ✨','I wonder if you know how beautiful your smile is. I hope you have more reasons to smile like this every day.','Nov 12',128),
P('#e9dccf','#f5efe6','☕','Sunday coffee','slow mornings only','You make even a plain Sunday look like a movie scene. I’d love to know what you were thinking about here.','Nov 3',96),
P('#f9d5e5','#fdeff2','🌷','Flowers for no reason','because why not','You deserve flowers for no reason, all the time. This one made me smile for a whole hour.','Oct 27',142),
P('#d8e2dc','#f6efe7','📚','Book nook','currently reading…','Of course you’d be the kind of person who gets lost in a good story. I’d listen to you talk about it for hours.','Oct 19',77),
P('#fcd5ce','#f8edeb','🌅','Chasing sunsets','the sky showed off today','Same sky, different places. I like knowing we’re under the same one.','Oct 8',165),
P('#e8d5e0','#faf3f0','🎀','Little things','soft girl era','I notice the little things about you: how you laugh first before you finish the joke. It’s my favorite thing.','Sep 30',111)],
highlights:[
{id:uid(),title:'Her Little Moments',cover:ph('#f6c9d0','#f3e3d3','🌸'),items:[{src:ph('#f6c9d0','#fbe9d7','😊'),v:0,note:'The way you light up a room, even through a screen.'},{src:ph('#e9dccf','#f5efe6','☕'),v:0,note:'Coffee dates, someday.'}]},
{id:uid(),title:'Pretty Smiles',cover:ph('#fcd5ce','#f8edeb','😊'),items:[{src:ph('#fcd5ce','#fff1e6','😁'),v:0,note:'This one. Always this one.'}]},
{id:uid(),title:'Things I Notice',cover:ph('#d8e2dc','#f6efe7','👀'),items:[{src:ph('#d8e2dc','#f6efe7','✨'),v:0,note:'You say “thank you” to everyone. It doesn’t go unnoticed.'}]},
{id:uid(),title:'From Afar',cover:ph('#e8d5e0','#faf3f0','🌙'),items:[{src:ph('#c9d6ea','#f1e6f4','🌙'),v:0,note:'Goodnight from the other side of the world.'}]}],
popups:{on:true,badge:true,first:12,every:50,max:3,list:[{t:'Psst…',m:'I just wanted to remind you that you’re appreciated.'},{t:'New notification!',m:'Someone thinks you’re wonderful.'},{t:'Just passing by',m:'Just passing by your profile again. Don’t mind me. ♡'}]},
letter:{h:'If I Could Leave a Comment on Every Little Moment…',b:'I’d tell you that your smile is my favorite notification.\n\nI’d say you’re kind in ways you don’t notice, and that the world is softer with you in it.\n\nDistance is just a number, but the way I think of you is not small at all.\n\nThis is my little corner to say it: I see you, and I appreciate you.',sig:'— someone who’s always rooting for you ♡',font:'hand',align:'left',bg:'#fff5f1',deco:true},
design:{bg:'#faf6f1',ac:'#e8899a',font:'serif',gap:3,radius:12},
intro:{on:true,emoji:'🌸',title:'Opening my pretty girlfriend’s page…',sub:'Just a little corner I made to appreciate you.',btn:'Open her page ♡'}});
// ---- storage
const DB=()=>new Promise((r,j)=>{const q=indexedDB.open('ldr',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const load=async k=>{try{const d=await DB();return await new Promise(r=>{const g=d.transaction('s').objectStore('s').get(k);g.onsuccess=()=>r(g.result);g.onerror=()=>r()})}catch(e){}};
let S,st;const seedEl=$('#seed'),seed=seedEl?JSON.parse(seedEl.textContent):null,KEY='st:'+(seed?seed.rev:'sample');
S=(await load(KEY))||seed||D();S.intro=S.intro||D().intro;
const save=()=>{clearTimeout(st);st=setTimeout(async()=>{try{const d=await DB();d.transaction('s','readwrite').objectStore('s').put(S,KEY);note('Auto-saved in this browser')}catch(e){note('Couldn’t save locally. Download to keep your work.')}},400)};
const note=t=>{const e=$('#st');if(e)e.textContent=t};
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)};
// ---- icons
const I={home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',heart:'<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 10c0 5.8-8 11-8 11z"/>',send:'<path d="M22 3L2 11l7 3 3 7z"/><path d="M22 3L9 14"/>',plus:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>'};
const ic=(n,f)=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="${f||'none'}" stroke="${f&&f!=='none'?f:'currentColor'}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">${I[n]}</svg>`;
const media=(x,m)=>x.v?`<video src="${x.src}" ${m==1?'muted playsinline preload="metadata"':m==2?'playsinline':'controls playsinline'}></video>`:`<img src="${x.src}" alt="${esc(x.title||'')}" ${m==1?'loading="lazy"':''}>`;
// ---- site
let q='',qo=0,fl=0,cur=0,ci=0,seen=0,rt;const all=x=>[x,...(x.more||[])],step=d=>{const n=all(S.posts[cur]).length;openPost(cur,(ci+d+n)%n)};
$('#root').innerHTML='<div id="site"></div><div id="ov"></div><div id="toast"></div>';
const apply=()=>{clearTimeout(rt);rt=setTimeout(()=>{draw();save()},120)};
function draw(){const d=S.design,p=S.profile,L=S.letter,r=document.documentElement.style;
r.setProperty('--bg',d.bg);r.setProperty('--ac',d.ac);r.setProperty('--gap',d.gap+'px');r.setProperty('--r',d.radius+'px');r.setProperty('--font',F[d.font]);
document.title='@'+p.user;
$('#site').innerHTML=`<div class="bar"><span class="logo">${esc(p.user)}</span><div class="nav"><button data-a="top" aria-label="Home">${ic('home')}</button><button data-a="search" aria-label="Search">${ic('search')}</button><button data-a="bell" aria-label="Notifications">${ic('heart')}<span id="bd"></span></button>${S.showEdit?`<button data-a="newpost" aria-label="New post">${ic('plus')}</button>`:''}<button data-a="letter" aria-label="Letter">${ic('send')}</button></div></div>
<input id="q" class="q" placeholder="Search her feed…" value="${esc(q)}" ${qo?'':'hidden'}>
<main class="wrap"><header class="prof"><img class="av" src="${p.avatar}" alt=""><div><div class="row"><h1>${esc(p.user)}</h1><button class="btn pri" data-a="follow">${fl?'Following ✓':'Follow'}</button><button class="btn" data-a="msg">Message</button></div>
<div class="stats"><span><b>${esc(p.posts||S.posts.length)}</b> posts</span><span><b>${esc(p.followers)}</b> followers</span><span><b>${esc(p.following)}</b> following</span></div><div class="nm">${esc(p.name)}</div><div class="bio">${esc(p.bio)}</div></div></header>
<div class="hls">${S.highlights.map((h,i)=>`<button class="hl" data-hl="${i}"><span class="rg"><img src="${h.cover}" alt=""></span>${esc(h.title)}</button>`).join('')}</div>
<div class="tabs1">Posts</div><div class="grid" id="grid"></div>
<section id="letter" class="ltr" style="background:${L.bg};text-align:${L.align};font-family:${F[L.font]}">${L.deco?'<span class="dc d1">✿</span><span class="dc d2">♡</span><span class="dc d3">✦</span>':''}<h2>${esc(L.h)}</h2><div class="lb">${esc(L.b)}</div><p class="sg">${esc(L.sig)}</p></section></main><footer class="mut">made with ♡ from afar</footer>`;
drawGrid();bdg()}
function drawGrid(){const g=$('#grid');if(!g)return;const L=S.posts.map((x,i)=>[x,i]).filter(([x])=>!q||(x.title+x.caption+x.thought).toLowerCase().includes(q.toLowerCase()));
g.innerHTML=L.length?L.map(([x,i])=>`<button class="tile" data-pv="${i}" aria-label="${esc(x.title)}">${media(x,1)}<span class="hov">${ic('heart','#fff')} ${x.likes}</span>${(x.more||[]).length?'<span class="vb">❐</span>':x.v?'<span class="vb">▶</span>':''}</button>`).join(''):'<p class="mut c" style="grid-column:1/-1">No posts found.</p>'}
function bdg(){const e=$('#bd');if(!e)return;const n=Math.max(0,S.popups.list.length-seen);e.style.display=S.popups.on&&S.popups.badge&&n?'':'none';e.textContent=n}
// ---- overlays
const ov=(h,c)=>{clearTimeout(ov.t);$('#ov').className=c||'';$('#ov').innerHTML=h};
const closeOv=()=>{clearTimeout(ov.t);$('#ov').innerHTML='';$('#ov').className='';bdg()};
function openPost(i,k=0){cur=i;ci=k;const x=S.posts[i],p=S.profile,n=all(x).length;
ov(`<div class="pv" role="dialog"><div class="pm" id="pm">${media(all(x)[k])}${n>1?`<button class="mb l" data-a="mp" aria-label="Previous photo">‹</button><button class="mb r" data-a="mn" aria-label="Next photo">›</button><span class="dots">${all(x).map((_,z)=>`<i class="${z==k?'on':''}"></i>`).join('')}</span>`:''}</div><div class="pr"><div class="ph"><img class="av s" src="${p.avatar}" alt=""><b>${esc(p.user)}</b><button class="x" data-a="close" aria-label="Close">✕</button></div>
<div class="pc"><h3>${esc(x.title)}</h3><div class="cm"><img class="av s" src="${p.avatar}" alt=""><div><b>${esc(p.user)}</b> ${esc(x.caption)}${x.date?`<small>${esc(x.date)}</small>`:''}</div></div>${x.thought?`<div class="cm"><i class="va">${esc((S.viewer[0]||'?').toUpperCase())}</i><div><b>${esc(S.viewer)}</b> ${esc(x.thought)}</div></div>`:''}</div>
<div class="pa"><button class="lk ${x.liked?'on':''}" data-a="like" aria-label="Like">${ic('heart',x.liked?'var(--ac)':'none')}</button><button data-a="prev" aria-label="Previous">‹</button><button data-a="next" aria-label="Next">›</button><b id="lc">${x.likes} likes</b></div></div></div>`);const v=$('#ov .pm video');if(v)v.play().catch(()=>{v.muted=true;v.play().catch(()=>{});toast('Tap the volume on the video for sound')})}
function like(){const x=S.posts[cur];x.liked=!x.liked;x.likes+=x.liked?1:-1;const b=$('.lk');b.classList.toggle('on',x.liked);b.innerHTML=ic('heart',x.liked?'var(--ac)':'none');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');$('#lc').textContent=x.likes+' likes';apply()}
function openStory(i,j=0){const h=S.highlights[i];if(!h||!h.items.length){toast('Nothing in this highlight yet');return}if(j>=h.items.length)return closeOv();j=Math.max(0,j);const it=h.items[j];
ov(`<div class="st"><div class="bars">${h.items.map((_,k)=>`<i class="${k<j?'d':k==j?'a':''}"></i>`).join('')}</div><div class="sh"><img class="av s" src="${h.cover}" alt=""><b>${esc(h.title)}</b>${it.v?'<button class="x" data-a="snd" aria-label="Sound">🔊</button>':''}<button class="x" data-a="close" aria-label="Close">✕</button></div><div class="sm" data-sv="${i}:${j}">${media(it,2)}</div>${it.note?`<div class="sn"><i class="va">${esc((S.viewer[0]||'?').toUpperCase())}</i><div><b>${esc(S.viewer)}</b> ${esc(it.note)}</div></div>`:''}</div>`);
const v=$('#ov video');if(v){v.onended=()=>openStory(i,j+1);v.onloadedmetadata=()=>{const b=$('.bars i.a');if(b&&v.duration)b.style.setProperty('--d',v.duration+'s')};v.play().catch(()=>{v.muted=true;v.play().catch(()=>{});const s=$('[data-a=snd]');if(s)s.textContent='🔇';toast('Tap the speaker icon for sound')})}else ov.t=setTimeout(()=>openStory(i,j+1),4500)}
let pn=0,ps=0,pt;
function showPop(i){const L=S.popups.list;if(!L.length)return toast('No pop-up messages yet');const m=L[i??(pn++%L.length)];seen=Math.min(L.length,seen+1);
ov(`<div class="pop" role="dialog">${S.popups.badge?'<span class="bdg">1</span>':''}<div class="pi">${ic('heart','var(--ac)')}</div><h3>${esc(m.t)}</h3><p>${esc(m.m)}</p><button class="btn pri" data-a="close">Continue browsing</button><br><button class="lnk" data-a="close">Close</button></div>`,'soft')}
function sched(){clearTimeout(pt);const o=S.popups;if(!o.on||ps>=o.max)return;pt=setTimeout(()=>{if($('#ov').innerHTML||$('#ed').classList.contains('open'))return sched();showPop();ps++;sched()},Math.max(3,ps?o.every:o.first)*1000)}
$('#root').addEventListener('click',e=>{const t=e.target;
if(t.id==='ov')return closeOv();

const pv=t.closest('[data-pv]');if(pv)return openPost(+pv.dataset.pv);
const hl=t.closest('[data-hl]');if(hl)return openStory(+hl.dataset.hl);
const sv=t.closest('[data-sv]');if(sv){const[i,j]=sv.dataset.sv.split(':').map(Number),r=sv.getBoundingClientRect();return openStory(i,e.clientX<r.left+r.width/3?j-1:j+1)}
const a=t.closest('[data-a]')?.dataset.a;if(!a)return;const n=S.posts.length;
({close:closeOv,like,mp:()=>step(-1),mn:()=>step(1),snd:()=>{const v=$('#ov video');if(v){v.muted=!v.muted;$('[data-a=snd]').textContent=v.muted?'🔇':'🔊'}},prev:()=>openPost((cur+n-1)%n),next:()=>openPost((cur+1)%n),top:()=>scrollTo({top:0}),letter:()=>$('#letter').scrollIntoView(),bell:()=>showPop(),msg:()=>showPop(),
search:()=>{qo=!qo;if(!qo)q='';draw();if(qo)$('#q').focus()},follow:()=>{fl=!fl;draw()}})[a]?.()});
$('#root').addEventListener('dblclick',e=>{if(e.target.closest('#pm')&&!S.posts[cur].liked)like();if(e.target.closest('#pm')){const h=document.createElement('span');h.className='big';h.textContent='♥';$('#pm').append(h);setTimeout(()=>h.remove(),800)}});

let tx;$('#root').addEventListener('touchstart',e=>{tx=e.target.closest('#pm')?e.touches[0].clientX:null},{passive:true});$('#root').addEventListener('touchend',e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>50&&all(S.posts[cur]).length>1)step(d<0?1:-1)});
$('#root').addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;drawGrid()}});
addEventListener('keydown',e=>{if(e.key==='Escape')$('#ov').innerHTML&&closeOv();else if($('.pv')&&e.key==='ArrowRight')openPost((cur+1)%S.posts.length);else if($('.pv')&&e.key==='ArrowLeft')openPost((cur+S.posts.length-1)%S.posts.length);});

function showIntro(first){const n=S.intro,e=document.createElement('div');e.id='intro';e.innerHTML=`<div class="ib"><img class="av" src="${S.profile.avatar}" alt=""><div class="ie">${esc(n.emoji)}</div><h1>${esc(n.title)}</h1><p>${esc(n.sub)}</p><div class="ibar"><i></i></div><button class="btn pri" id="ib" disabled>${esc(n.btn)}</button></div>`;document.body.append(e);
setTimeout(()=>{const b=$('#ib');if(b)b.disabled=false},1800);e.addEventListener('click',ev=>{if(ev.target.id==='ib'&&!ev.target.disabled){e.classList.add('out');setTimeout(()=>{e.remove();if(first)sched()},500)}})}
// ---- export

draw();if(S.intro.on)showIntro(1);else sched();
})();
</script></body></html>
